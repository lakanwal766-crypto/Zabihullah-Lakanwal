{% extends 'pharmacy/base.html' %}{% block title %}نوی درمل{% endblock %}{% block content %}
<header class="page-head"><div><h1>+ د نوي درمل ثبت</h1><p>د درمل معلومات په دقت ولیکئ</p></div><a class="secondary" href="/medicines/">بېرته</a></header>
<form method="post" class="panel form-grid">{% csrf_token %}
<label>د درمل نوم *<input required name="name"></label><label>جنریک نوم<input name="generic_name"></label><label>قوت (Strength)<input name="strength" placeholder="500 mg"></label><label>ډول (Form)<input name="form" placeholder="Tablet / Syrup"></label><label>Batch نمبر<input name="batch_number"></label><label>د ختمېدو نېټه<input type="date" name="expiry_date"></label><label>د پېرلو قیمت<input type="number" step="0.01" min="0" name="purchase_price" value="0"></label><label>د خرڅلاو قیمت<input type="number" step="0.01" min="0" name="sale_price" value="0"></label><label>موجود مقدار<input type="number" min="0" name="stock" value="0"></label><label>د کم سټاک حد<input type="number" min="0" name="low_stock_threshold" value="10"></label><label>عرضه کوونکی<select name="supplier"><option value="">— نه دی ټاکل شوی —</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><div class="form-actions"><button class="primary" type="submit">درمل ثبت کړه</button></div></form>{% endblock %}
